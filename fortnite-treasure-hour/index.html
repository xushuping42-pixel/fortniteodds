<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Treasure Hour Timer - FortniteOdds</title>
<style>
/* ============================================================
   FortniteOdds — self-contained stylesheet
   深色底 + 薄荷绿单色强调。首页与两个内页共用。
   ============================================================ */
:root{
  --bg:#080a14;
  --surface:#11162a;
  --surface-2:#161c33;
  --line:#232a46;
  --line-soft:#1a2038;
  --text:#eef0f8;
  --text-2:#a6aec9;
  --text-3:#6d7694;
  --accent:#4ade80;
  --accent-ink:#04220f;
  --accent-soft:rgba(74,222,128,.12);
  --accent-line:rgba(74,222,128,.35);
  --warn:#fbbf24;
  --radius:12px;
  --radius-lg:18px;
  --maxw:840px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--font);font-size:16px;line-height:1.68;
  color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
/* 背景：顶部光晕 + 极淡网格（固定视口，滚动不跟着动） */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(900px 520px at 50% -12%, rgba(74,222,128,.13), transparent 68%),
    radial-gradient(760px 420px at 100% 4%, rgba(56,189,248,.07), transparent 62%),
    linear-gradient(180deg,#080a14 0%,#0a0e1c 45%,#080a14 100%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.032) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.032) 1px, transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse 78% 58% at 50% 0%, #000 18%, transparent 74%);
          mask-image:radial-gradient(ellipse 78% 58% at 50% 0%, #000 18%, transparent 74%);
}
::selection{background:rgba(74,222,128,.28);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

/* ---------- 布局 ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px 72px}
header{padding:22px 0 18px;margin-bottom:34px;border-bottom:1px solid var(--line-soft)}
.logo{
  display:inline-flex;align-items:center;gap:10px;
  font-size:17px;font-weight:800;letter-spacing:-.01em;
  color:var(--text);text-decoration:none;transition:opacity .18s ease;
}
.logo::before{
  content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft), 0 0 18px rgba(74,222,128,.75);
}
.logo:hover{opacity:.82}

/* ---------- 标题与正文 ---------- */
h1{
  margin:0 0 16px;font-size:clamp(26px,4.4vw,39px);line-height:1.2;
  font-weight:800;letter-spacing:-.022em;text-wrap:balance;
}
h2{
  margin:46px 0 14px;font-size:clamp(19px,2.4vw,22px);line-height:1.34;
  font-weight:700;letter-spacing:-.012em;text-wrap:balance;
}
h3{margin:0 0 6px;font-size:17px;line-height:1.4;font-weight:700}
p{margin:0 0 15px;color:var(--text-2)}
p strong,li strong{color:var(--text);font-weight:650}
h1 + p{font-size:17px;color:var(--text-2);max-width:64ch}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
ol,ul{margin:0 0 18px;padding-left:22px;color:var(--text-2)}
li{margin-bottom:9px}
li::marker{color:var(--text-3)}
main > p a{font-weight:600}

/* ---------- Quick answer ---------- */
.qa{
  position:relative;margin:26px 0 34px;padding:20px 22px 18px;
  background:linear-gradient(180deg,var(--surface),var(--surface-2));
  border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--radius);box-shadow:0 18px 40px -28px rgba(0,0,0,.9);
}
.qa h2{
  margin:0 0 12px;font-size:12px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);
}
.qa ul{margin:0;padding:0;list-style:none}
.qa li{position:relative;margin:0 0 10px;padding-left:22px;font-size:15.5px;color:var(--text-2)}
.qa li:last-child{margin-bottom:0}
.qa li::before{
  content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;
  border-radius:2px;background:var(--accent);opacity:.85;transform:rotate(45deg);
}

/* ---------- 按钮 ---------- */
.btns{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0 8px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 22px;font-size:15px;font-weight:700;letter-spacing:-.005em;
  color:var(--accent-ink);background:var(--accent);border:1px solid var(--accent);
  border-radius:10px;box-shadow:0 12px 30px -14px rgba(74,222,128,.7);
  text-decoration:none;
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.btn:hover{
  background:#5be88d;transform:translateY(-1px);
  box-shadow:0 16px 36px -14px rgba(74,222,128,.85);text-decoration:none;
}
.btn:active{transform:translateY(0)}
.btn.alt{color:var(--text);background:rgba(255,255,255,.03);border:1px solid var(--line);box-shadow:none}
.btn.alt:hover{background:rgba(255,255,255,.06);border-color:var(--accent-line);box-shadow:0 12px 28px -18px rgba(0,0,0,.9)}

/* ---------- 表格 ---------- */
table{
  width:100%;margin:20px 0 14px;border-collapse:separate;border-spacing:0;
  font-size:15px;font-variant-numeric:tabular-nums;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;
}
thead th{
  padding:11px 14px;text-align:left;font-size:11.5px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);
  background:rgba(255,255,255,.025);border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody td{padding:12px 14px;color:var(--text-2);border-bottom:1px solid var(--line-soft)}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s ease}
tbody tr:hover{background:rgba(74,222,128,.05)}
tbody td:first-child{color:var(--text);font-weight:600}
tbody td:last-child{color:var(--accent);font-weight:600}
tbody td:nth-child(2){font-variant-numeric:tabular-nums}

/* ---------- 工具卡片 ---------- */
.cards{display:grid;gap:16px;grid-template-columns:1fr 1fr;margin:22px 0 10px}
.card{
  position:relative;display:flex;flex-direction:column;padding:20px 20px 18px;
  background:linear-gradient(180deg,var(--surface),var(--surface-2));
  border:1px solid var(--line);border-radius:var(--radius-lg);
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.card:hover{
  transform:translateY(-3px);border-color:var(--accent-line);
  box-shadow:0 24px 48px -30px rgba(0,0,0,1), 0 0 0 1px rgba(74,222,128,.08);
}
.card p{font-size:14.5px;color:var(--text-3);margin-bottom:16px}
.card a{margin-top:auto;font-size:14px;font-weight:700;color:var(--accent);text-decoration:none}
.card a:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- 公式 ---------- */
code{
  display:inline-block;padding:8px 14px;max-width:100%;overflow-x:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:15px;letter-spacing:.01em;color:var(--accent);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
}

/* ---------- FAQ ---------- */
main > h3{margin-top:26px;margin-bottom:4px;color:var(--text)}
main > h3 + p{margin-bottom:0}

/* ---------- 辅助文字 / 页脚 ---------- */
.mu{font-size:13.5px;line-height:1.62;color:var(--text-3)}
footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--text-3)}
footer p{margin:0 0 8px;font-size:13px;color:var(--text-3)}
footer p:last-child{margin-bottom:0}
footer strong{color:var(--text-2);font-weight:700}
footer a{color:var(--text-2);text-decoration:none}
footer a:hover{color:var(--accent)}

/* ============================================================
   内页组件（计算器 / 时间表页用，首页不出现）
   ============================================================ */
.field{display:grid;gap:8px;margin:0 0 16px}
.field label{font-size:13.5px;font-weight:700;color:var(--text-2)}
.field input,.field select{
  width:100%;padding:12px 14px;font-family:inherit;font-size:16px;color:var(--text);
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  transition:border-color .16s ease, background .16s ease;
}
.field input:hover,.field select:hover{border-color:#2c3454}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);background:var(--surface-2)}
.result{
  margin:22px 0;padding:22px;text-align:center;
  background:radial-gradient(600px 200px at 50% 0%, rgba(74,222,128,.1), transparent 70%), var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-lg);
}
.result strong{
  display:block;font-size:clamp(32px,7vw,46px);line-height:1.1;font-weight:800;
  letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums;
}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.countdown-unit{padding:16px 10px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.countdown-unit b{display:block;font-size:clamp(22px,5vw,30px);font-weight:800;letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums}
.countdown-unit span{display:block;margin-top:2px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  font-size:12px;font-weight:700;letter-spacing:.02em;
  color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);
}
.badge.is-pending{color:var(--warn);background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.35)}
.notice{
  margin:20px 0;padding:14px 18px;font-size:14px;color:var(--text-2);
  background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--warn);border-radius:var(--radius);
}

/* ---------- 响应式 ---------- */
@media (max-width:640px){
  .wrap{padding:0 18px 56px}
  header{padding:18px 0 14px;margin-bottom:26px}
  h2{margin-top:38px}
  .btns{flex-direction:column}
  .btn{width:100%}
  .cards{grid-template-columns:1fr}
  .countdown{grid-template-columns:repeat(2,1fr)}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;font-size:14px}
  thead th,tbody td{padding:10px 12px;white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
  .btn:hover,.card:hover{transform:none}
}
@supports (scrollbar-width:thin){
  *{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
}
</style>
</head>
<body>
<div class="wrap">
<header><a class="logo" href="/">FortniteOdds</a></header>
<main>
<h1>Treasure Hour Timer</h1>
<p>Coming soon</p>
</main>
</div>
</body>
</html>
